[package]
name = "pearl"
version = "0.1.1"
description = "Pearl: a to-do and reminder app"
edition = "2021"

[lib]
name = "pearl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
discord-rich-presence = "1.1.0"

# The updater only exists on desktop. Android updates go through the store/APK.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
